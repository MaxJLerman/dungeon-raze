# The co-op relay: one Worker and one Durable Object class (a room).
# Deploy steps are in README.md. Nothing here names an account.
name = "dungeon-raze-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

# Origins that may open a room, comma separated. localhost and 127.0.0.1
# are always allowed as well.
[vars]
ALLOWED_ORIGINS = "https://maxjlerman.github.io"

# No request logs, no traces: nothing about a player is kept.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
