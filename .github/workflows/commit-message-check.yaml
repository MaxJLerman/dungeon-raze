name: Commit Message Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: commit-msg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reject-ai-trailers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject AI attribution trailers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=$(git log "origin/$BASE_REF..HEAD" --format='%H' | while read sha; do
            git log -1 --format='%B' "$sha" | grep -iqE '^(Co-Authored-By:|🤖 Generated with|Generated with \[?Claude|Claude-Session:)' && echo "$sha $(git log -1 --format='%s' "$sha")"
          done || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits with AI attribution trailers found. Strip them with the prepare-commit-msg hook or amend the commit."
            echo "$bad"
            exit 1
          fi
